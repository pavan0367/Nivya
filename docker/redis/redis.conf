# ==============================================================================
# Nivya Redis Configuration
# ==============================================================================

# Network & Ports
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Security (Pass password via command line or env in docker-compose)
# requirepass nivya_redis_secure_dev_password

# Memory Management
maxmemory 512mb
maxmemory-policy volatile-lru

# Persistence (AOF enabled for durability)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Logging
loglevel notice

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: nivya-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database DataSource Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:nivya_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${MYSQL_USER:nivya_user}
    password: ${MYSQL_PASSWORD:nivya_secure_dev_password_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: NivyaHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:20000}
      max-lifetime: 1800000

  # JPA & Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Flyway Migration Settings
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2000ms}

# Security & Application Settings
nivya:
  jwt:
    secret: ${JWT_SECRET:4e6976796153656375726546616d696c795361666574794b6579323032363132}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000} # 15 mins
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  pairing:
    code-ttl-minutes: ${PAIRING_CODE_TTL_MINUTES:10}
  convocation:
    view-duration-seconds: ${CONVOCATION_VIEW_MODE_DURATION_SECONDS:120}
    child-viewed-expiry-hours: ${CONVOCATION_CHILD_VIEWED_EXPIRY_HOURS:1}
    child-notification-text: ${CONVOCATION_CHILD_NOTIFICATION_TEXT:Check your battery status}
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

# Actuator Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# OpenAPI / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Logging Settings
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.nivya: ${LOG_LEVEL_NIVYA:INFO}
    org.springframework.security: INFO
    org.hibernate.SQL: ERROR
